name: Update token grass

on:
  workflow_dispatch:
    inputs:
      through_date:
        description: 'Last date to show (YYYY-MM-DD; default: yesterday in Asia/Seoul)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: token-grass
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate light and dark token grass
        env:
          TOKEN_GIST_URL: ${{ vars.TOKEN_GIST_URL }}
          THROUGH_DATE: ${{ inputs.through_date }}
        run: |
          date_args=()
          if [[ -n "$THROUGH_DATE" ]]; then
            date_args+=(--today "$THROUGH_DATE")
          fi
          python3 scripts/render_profile.py \
            --gist-url "$TOKEN_GIST_URL" \
            --output "$RUNNER_TEMP/token-output" "${date_args[@]}"
      - name: Publish generated images
        env:
          TOKEN_OUTPUT: ${{ runner.temp }}/token-output
          TOKEN_PUBLISH: ${{ runner.temp }}/token-publish
        run: bash scripts/publish_assets.sh
