<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1일 1억 토큰 · Profile preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1f2328; font: 14px system-ui, sans-serif; }
  main { max-width: 964px; margin: 36px auto; padding: 24px 32px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; color: #59636e; }
  button { border: 1px solid #d1d9e0; background: #f6f8fa; color: inherit; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
  img { display: block; width: 100%; height: auto; }
  .grass { margin-top: 24px; }
  body.dark { background: #0d1117; color: #f0f6fc; }
  .dark header { color: #9198a1; }
  .dark button { background: #161b22; border-color: #3d444d; }
  @media (max-width: 600px) { main { margin: 0; padding: 20px 12px; } }
</style>
<main>
  <header><span>SUNGMYEONGGI / README.md</span><button id="theme">Toggle theme</button></header>
  <img src="assets/daily-routine.svg" alt="1일 1억 토큰: daily goal terminal">
  <img class="grass" id="grass" src="assets/token-activity-light.svg" alt="Codex token activity">
</main>
<script>
  function setTheme(dark) {
    document.body.classList.toggle('dark', dark);
    document.getElementById('grass').src = `assets/token-activity-${dark ? 'dark' : 'light'}.svg`;
  }
  setTheme(new URLSearchParams(location.search).get('theme') === 'dark');
  document.getElementById('theme').onclick = () => setTheme(!document.body.classList.contains('dark'));
</script>
</html>
